name: Daily Research Digest

run-name: >-
  Daily Research Digest · ${{ github.event_name }} · ${{ inputs.digest_date || 'auto-date' }} · ${{ inputs.topics || 'all-topics' }}

on:
  schedule:
    # GitHub Actions 使用 UTC；00:00 UTC 约等于北京时间 08:00。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      digest_date:
        description: "日报日期，格式 YYYY-MM-DD；留空则使用配置时区当天"
        required: false
        type: string
      topics:
        description: "可选主题 slug，空格分隔，例如 ai neuroscience"
        required: false
        type: string
      max_items:
        description: "每个主题最多条目数；留空使用 config/topics.yml"
        required: false
        type: string
      days_back:
        description: "向前抓取天数；留空使用 config/topics.yml"
        required: false
        type: string
      skip_telegram:
        description: "跳过 Telegram 推送"
        required: false
        default: false
        type: boolean
      skip_email:
        description: "跳过邮件推送"
        required: false
        default: false
        type: boolean
      top_journal_mode:
        description: "top 期刊筛选模式：off/rank/push/fetch-and-push；留空使用 config/sources.yml"
        required: false
        type: string
      min_impact_factor:
        description: "top 期刊最小 IF 阈值；留空使用 config/sources.yml，常用 10"
        required: false
        type: string
      keep_unknown_if:
        description: "top 期刊 push 模式下保留未知 IF 内容，例如预印本"
        required: false
        default: false
        type: boolean
      preview:
        description: "只生成预览和 artifact，不发送推送"
        required: false
        default: false
        type: boolean

env:
  # Proactively opt JavaScript actions into Node.js 24 to avoid GitHub-hosted runner Node.js 20 deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_TIMEOUT_SECONDS: ${{ secrets.OPENAI_TIMEOUT_SECONDS }}
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      DIGEST_TIMEZONE: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Build CLI arguments
        id: args
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DIGEST_DATE: ${{ inputs.digest_date }}
          INPUT_TOPICS: ${{ inputs.topics }}
          INPUT_MAX_ITEMS: ${{ inputs.max_items }}
          INPUT_DAYS_BACK: ${{ inputs.days_back }}
          INPUT_SKIP_TELEGRAM: ${{ inputs.skip_telegram }}
          INPUT_SKIP_EMAIL: ${{ inputs.skip_email }}
          INPUT_TOP_JOURNAL_MODE: ${{ inputs.top_journal_mode }}
          INPUT_MIN_IMPACT_FACTOR: ${{ inputs.min_impact_factor }}
          INPUT_KEEP_UNKNOWN_IF: ${{ inputs.keep_unknown_if }}
          INPUT_PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "$INPUT_DIGEST_DATE" ]; then
            ARGS="$ARGS --date '$INPUT_DIGEST_DATE'"
          fi
          if [ -n "$INPUT_TOPICS" ]; then
            ARGS="$ARGS --topics $INPUT_TOPICS"
          fi
          if [ -n "$INPUT_MAX_ITEMS" ]; then
            ARGS="$ARGS --max-items '$INPUT_MAX_ITEMS'"
          fi
          if [ -n "$INPUT_DAYS_BACK" ]; then
            ARGS="$ARGS --days-back '$INPUT_DAYS_BACK'"
          fi
          if [ -n "$INPUT_TOP_JOURNAL_MODE" ]; then
            ARGS="$ARGS --top-journal-mode '$INPUT_TOP_JOURNAL_MODE'"
          fi
          if [ -n "$INPUT_MIN_IMPACT_FACTOR" ]; then
            ARGS="$ARGS --min-impact-factor '$INPUT_MIN_IMPACT_FACTOR'"
          fi
          if [ "$INPUT_KEEP_UNKNOWN_IF" = "true" ]; then
            ARGS="$ARGS --keep-unknown-if"
          fi
          if [ "$INPUT_SKIP_TELEGRAM" = "true" ]; then
            ARGS="$ARGS --skip-telegram"
          fi
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_SKIP_EMAIL" = "true" ]; then
            ARGS="$ARGS --skip-email"
          fi
          if [ "$INPUT_PREVIEW" = "true" ]; then
            ARGS="$ARGS --preview"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          {
            echo "### Daily Research Digest arguments"
            echo "- event: $EVENT_NAME"
            echo "- schedule default: Telegram push enabled, email skipped unless manually triggered"
            echo "- args: \`$ARGS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate and push digest
        run: |
          set -euo pipefail
          python scripts/daily_digest.py ${{ steps.args.outputs.args }} --verbose

      - name: Notify Telegram on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "缺少 Telegram secret，跳过失败告警"
            exit 0
          fi
          python - <<'PY'
          import os
          import requests

          text = f"⚠️ 科研情报日报 GitHub Actions 失败\n{os.environ['RUN_URL']}"
          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text, "disable_web_page_preview": True},
              timeout=30,
          )
          response.raise_for_status()
          PY

      - name: List generated digests
        if: always()
        run: |
          find data/digests -type f -maxdepth 3 | sort || true

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-digest-${{ github.run_id }}
          path: |
            data/digests/**/*.md
            data/digests/**/*.html
            data/digests/**/*.json
          if-no-files-found: warn
