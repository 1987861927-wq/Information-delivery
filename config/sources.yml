sources:
  top_journal_filter:
    # mode:
    # - off: 不使用 IF/top 期刊逻辑。
    # - rank: 默认安全模式；不硬过滤，只给 top 期刊更高排序权重并在日报中展示 IF。
    # - push: 抓取后只保留 IF >= min_impact_factor 或配置允许保留的未知 IF 来源。
    # - fetch-and-push: PubMed 抓取阶段追加 top 期刊 Journal 检索式，随后再执行 push 过滤。
    mode: rank
    min_impact_factor: 10
    journal_catalog: config/journals.yml
    keep_unknown_if: false
    # arXiv/bioRxiv/medRxiv 通常没有正式期刊 IF；如希望 top 期刊过滤时仍保留预印本，可列入此处。
    keep_unknown_if_sources: []

  pubmed:
    enabled: true
    retmax_per_topic: 20
    request_delay_seconds: 0.34
    email_env: NCBI_EMAIL
    api_key_env: NCBI_API_KEY

  arxiv:
    enabled: true
    max_results_per_topic: 20
    request_delay_seconds: 3.0

  biorxiv:
    enabled: true
    max_results: 100
    request_delay_seconds: 1.0

  medrxiv:
    enabled: true
    max_results: 100
    request_delay_seconds: 1.0

  rss:
    enabled: true
    max_entries_per_feed: 20
    feeds:
      - name: ScienceDaily Neuroscience
        url: https://www.sciencedaily.com/rss/mind_brain/neuroscience.xml
        topics: [neuroscience]
      - name: ScienceDaily Materials Science
        url: https://www.sciencedaily.com/rss/matter_energy/materials_science.xml
        topics: [biomaterials]
      - name: ScienceDaily Artificial Intelligence
        url: https://www.sciencedaily.com/rss/computers_math/artificial_intelligence.xml
        topics: [ai]
      - name: ScienceDaily Bones and Orthopedics
        url: https://www.sciencedaily.com/rss/health_medicine/bones_and_orthopedics.xml
        topics: [orthopedics]
      - name: MIT News Artificial Intelligence
        url: https://news.mit.edu/rss/topic/artificial-intelligence2
        topics: [ai]
      - name: Nature Latest Research
        url: https://www.nature.com/nature.rss
        topics: [neuroscience, biomaterials, ai, orthopedics]
      - name: NIH News Releases
        url: https://www.nih.gov/news-events/news-releases/feed.xml
        topics: [neuroscience, biomaterials, orthopedics]
