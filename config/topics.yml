digest:
  timezone: Asia/Shanghai
  push_time_local: "08:00"
  default_days_back: 2
  default_max_items_per_topic: 5
  max_items_total: 40
  language: zh-CN
  title: 科研情报日报
  summary_style: concise_mobile

topics:
  - slug: neuroscience
    name: 神经科学
    description: 脑科学、神经退行性疾病、神经影像、突触、脑机接口等方向。
    max_items: 5
    keywords:
      - neuroscience
      - brain
      - neuron
      - synapse
      - neurodegeneration
      - Alzheimer
      - Parkinson
      - stroke
      - neuroimaging
      - brain-computer interface
      - BCI
      - spinal cord
    exclude_keywords:
      - neuroscience education
    pubmed_query: '(neuroscience OR brain OR neuron OR synapse OR neurodegeneration OR Alzheimer OR Parkinson OR stroke OR neuroimaging OR brain-computer interface)'
    arxiv_query: 'all:neuroscience OR all:brain OR all:neuroimaging OR all:"brain computer interface"'

  - slug: biomaterials
    name: 生物材料
    description: 水凝胶、支架、组织工程、再生医学、植入物涂层和药物递送。
    max_items: 5
    keywords:
      - biomaterials
      - biomaterial
      - hydrogel
      - scaffold
      - tissue engineering
      - bioactive materials
      - regenerative medicine
      - implant coating
      - drug delivery
      - extracellular matrix
    exclude_keywords: []
    pubmed_query: '(biomaterials OR biomaterial OR hydrogel OR scaffold OR tissue engineering OR bioactive materials OR regenerative medicine OR implant coating OR drug delivery)'
    arxiv_query: 'all:biomaterials OR all:hydrogel OR all:"tissue engineering" OR all:"drug delivery"'

  - slug: ai
    name: 人工智能
    description: 机器学习、深度学习、基础模型、医学影像、计算生物学和 AI for Science。
    max_items: 6
    keywords:
      - artificial intelligence
      - machine learning
      - deep learning
      - foundation model
      - large language model
      - LLM
      - medical imaging
      - bioinformatics
      - AI for science
      - computer vision
      - multimodal
    exclude_keywords:
      - game AI
    pubmed_query: '(artificial intelligence OR machine learning OR deep learning OR foundation model OR large language model OR medical imaging OR bioinformatics)'
    arxiv_query: 'cat:cs.AI OR cat:cs.LG OR cat:cs.CV OR cat:stat.ML OR all:"large language model" OR all:"medical imaging"'

  - slug: orthopedics
    name: 骨科
    description: 骨再生、软骨、骨关节炎、骨折愈合、脊柱、关节置换和运动医学。
    max_items: 5
    keywords:
      - orthopedics
      - orthopaedics
      - bone regeneration
      - cartilage
      - osteoarthritis
      - fracture healing
      - spine surgery
      - joint replacement
      - arthroplasty
      - tendon
      - ligament
    exclude_keywords: []
    pubmed_query: '(orthopedics OR orthopaedics OR bone regeneration OR cartilage OR osteoarthritis OR fracture healing OR spine surgery OR joint replacement OR arthroplasty)'
    arxiv_query: 'all:orthopedics OR all:orthopaedics OR all:"bone regeneration" OR all:osteoarthritis OR all:"fracture healing"'
